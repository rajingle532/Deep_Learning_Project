name: Deployments

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Register Streamlit Cloud Deployment
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployment = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: context.sha,
                environment: 'Production',
                auto_merge: false,
                required_contexts: [],
                description: 'Streamlit Community Cloud Live App'
              });
              
              if (deployment.data && deployment.data.id) {
                await github.rest.repos.createDeploymentStatus({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.data.id,
                  state: 'success',
                  environment: 'Production',
                  environment_url: 'https://agriguardai1.streamlit.app/',
                  auto_inactive: true
                });
                console.log('Successfully published Production deployment to GitHub sidebar.');
              }
            } catch (err) {
              console.error('Deployment status update:', err.message);
            }
